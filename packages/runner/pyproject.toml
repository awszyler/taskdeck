[project]
name = "taskdeck-runner"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35",
  "taskdeck-proto",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "websockets>=13.1",
  "prometheus-client>=0.20",
]

[project.scripts]
taskdeck-runner = "taskdeck_runner.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["taskdeck_runner"]
