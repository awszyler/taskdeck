[project]
name = "taskdeck-core"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "taskdeck-proto",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.29",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "websockets>=13.1",
  "openai>=1.50",
  "cryptography>=43",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "slowapi>=0.1.9",
  "prometheus-fastapi-instrumentator>=7.0",
  "pgvector>=0.3",
  "boto3>=1.35",
  "python-multipart>=0.0.18",
]

[project.scripts]
taskdeck-core = "taskdeck_core.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["taskdeck_core"]
