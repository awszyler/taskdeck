[project]
name = "taskdeck-sandbox-host"
version = "0.0.0"
description = "Per-host sandbox provisioning + reverse proxy for taskdeck"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "docker>=7.1",
  "httpx>=0.27",
  "boto3>=1.35",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0",
  "taskdeck-proto",
]

[project.scripts]
taskdeck-sandbox-host = "sandbox_host.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sandbox_host"]
