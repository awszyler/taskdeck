[project]
name = "taskdeck"
version = "0.0.0"
requires-python = ">=3.12"
description = "Taskdeck workspace root"

[tool.uv.workspace]
members = ["packages/proto", "packages/core", "packages/runner", "apps/sandbox-host"]

[tool.uv.sources]
taskdeck-proto = { workspace = true }
taskdeck-core = { workspace = true }
taskdeck-runner = { workspace = true }
taskdeck-sandbox-host = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "ruff>=0.8",
  "pyright>=1.1.380",
  "httpx>=0.27",
  "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
  "packages/proto/tests",
  "packages/core/tests",
  "packages/runner/tests",
  "apps/sandbox-host/tests",
]
# Avoid module-name collisions when multiple packages have same-named test dirs.
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]

[tool.pyright]
include = [
  "packages/proto/taskdeck_proto",
  "packages/core/taskdeck_core",
  "packages/runner/taskdeck_runner",
  "apps/sandbox-host/sandbox_host",
]
pythonVersion = "3.12"
